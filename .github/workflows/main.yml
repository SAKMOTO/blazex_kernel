name: Build BlazeX Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: defconfig

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 python3-pip zip \
          clang lld llvm \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        echo "🔎 Toolchain versions:"
        clang --version
        ld.lld --version
        aarch64-linux-gnu-gcc --version

    - name: 🧹 Clean kernel source
      run: |
        make mrproper

    - name: ⚙️ Load defconfig
      run: |
        make $DEFCONFIG

    - name: 🔧 Patch / Disable problematic configs (quiet)
      run: |
        echo "Disabling Samsung options that break CI..."
        for cfg in CONFIG_LD_IS_LLD CONFIG_EFI CONFIG_EFI_STUB CONFIG_ARM64_VDSO CONFIG_LTO CONFIG_CFI_CLANG CONFIG_FTRACE CONFIG_DYNAMIC_FTRACE; do
          scripts/config --disable $cfg 2>/dev/null || true
        done
        echo "Regenerating defconfig quietly..."
        make olddefconfig > /dev/null

    - name: 🔨 Build kernel (LLVM + GCC cross)
      run: |
        make -j$(nproc) \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          O=out

    - name: ✅ Verify build outputs
      run: |
        ls -lh out/arch/arm64/boot/

    - name: 📦 Prepare AnyKernel3 ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE-$(date +%Y%m%d-%H%M).zip *

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel
        path: |
          BlazeX-S20FE-*.zip
          out/arch/arm64/boot/Image.gz-dtb
        retention-days: 7

    - name: 🎉 Build finished
      run: |
        echo "======================================"
        echo " ✅ Kernel build SUCCESSFUL"
        echo " 📦 Flashable ZIP uploaded"
        echo "======================================"
