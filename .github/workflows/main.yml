name: BlazeX Kernel Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: defconfig
      OUTDIR: out

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 python3-pip zip \
          clang lld llvm \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        which ld.lld
        ld.lld --version
        clang --version

    - name: 🧹 Clean kernel
      run: |
        make O=$OUTDIR mrproper

    - name: ⚙️ Load defconfig
      run: |
        make O=$OUTDIR $DEFCONFIG

    - name: 🔧 Disable problematic Samsung options
      run: |
        for cfg in CONFIG_LD_IS_LLD CONFIG_EFI CONFIG_EFI_STUB CONFIG_QCLD CONFIG_LTO CONFIG_CFI_CLANG CONFIG_FTRACE CONFIG_DYNAMIC_FTRACE CONFIG_FUNCTION_TRACER; do
          scripts/config --file $OUTDIR/.config --disable $cfg 2>/dev/null || true
        done
        # Silence Kconfig interactive output
        make O=$OUTDIR olddefconfig > /dev/null

    - name: 🔨 Build kernel
      run: |
        make -j$(nproc) \
          O=$OUTDIR \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: ✅ Verify Image
      run: |
        ls -lh $OUTDIR/arch/arm64/boot/Image.gz

    - name: 📦 AnyKernel3 ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp $OUTDIR/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../BlazeX-S20FE-$(date +%Y%m%d-%H%M).zip *

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel
        path: |
          BlazeX-S20FE-*.zip
          $OUTDIR/arch/arm64/boot/Image.gz
        retention-days: 7

    - name: 🎉 Build finished
      run: |
        echo "======================================"
        echo " ✅ Kernel build SUCCESSFUL"
        echo " 📦 Flashable ZIP uploaded"
        echo "======================================"
